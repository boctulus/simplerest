name: Tests

on:
  push:
    branches: [master, main, develop, fix/composer-distribution-modularization-recovered-20261022]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, mbstring, pdo, pdo_mysql, json, openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run isolated core and ACL tests (no .env)
        run: |
          mkdir -p reports
          vendor/bin/phpunit unit-tests/composer unit-tests/css unit-tests/compatibility unit-tests/command/CommandRegistryComposerPackageTest.php unit-tests/acl --no-coverage --do-not-cache-result --log-junit reports/junit.xml

      - name: Verify distribution gate fixtures
        run: php scripts/distribution/verify-release-artifacts.php --self-test

      - name: Verify Composer archives and generated starter
        if: matrix.php-version != '8.3'
        run: php scripts/distribution/verify-release-artifacts.php

      - name: Verify external Composer VCS consumers
        if: matrix.php-version == '8.3'
        run: php scripts/distribution/verify-release-artifacts.php --with-consumer-install

      - name: Run independent extension suites
        run: |
          composer --working-dir=packages/boctulus/simplerest-pdf install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
          composer --working-dir=packages/boctulus/simplerest-pdf test
          composer --working-dir=packages/boctulus/simplerest-code-tools install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
          composer --working-dir=packages/boctulus/simplerest-code-tools test
          composer --working-dir=packages/boctulus/simplerest-integrations install --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins
          composer --working-dir=packages/boctulus/simplerest-integrations test

      - name: Run PHPStan
        run: composer cs || true
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: reports/
