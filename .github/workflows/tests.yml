name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microcore-and-pack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    name: Microcore and PACK PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validate published microcore manifest
        run: composer validate --strict --no-check-publish

      - name: Validate and install isolated development tools
        env:
          COMPOSER: composer-dev.json
        run: |
          composer validate --strict --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run microcore PHPUnit suite
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --no-coverage unit-tests/microcore

      - name: Run PACK and legacy-library boundary suite
        run: vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php --no-coverage unit-tests/pack

      - name: Curate committed microcore with PACK
        run: php com pack build --profile=core --source-commit="$GITHUB_SHA" --dest="$RUNNER_TEMP/simplerest-pack"

      - name: Produce isolated Composer snapshot from PACK only
        if: matrix.php-version == '8.3'
        shell: pwsh
        run: |
          ./scripts/composer/build-core-source-snapshot.ps1 -CuratedDirectory "$env:RUNNER_TEMP/simplerest-pack" -SourceCommit "$env:GITHUB_SHA" -OutputDirectory "$env:RUNNER_TEMP/simplerest-core-release" -Version 3.0.0
          if (-not (Test-Path "$env:RUNNER_TEMP/simplerest-core-release/repository/composer.json")) {
            throw 'Missing Composer package manifest'
          }
          if (Test-Path "$env:RUNNER_TEMP/simplerest-core-release/repository/docs") {
            throw 'Internal documentation leaked into Composer snapshot'
          }

# The microcore suite certifies that src/framework requires only PHP and the
# approved doctrine/inflector exception.
# Application and package suites are migrated and tested independently.

  pack-curation:
    runs-on: ubuntu-latest
    name: Curated PACK Composer distribution
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Curate the whole committed src/framework tree from immutable Git commit
        run: |
          php com pack build --profile=core --dry-run
          php com pack build --profile=core --source-commit="$GITHUB_SHA" --dest="$RUNNER_TEMP/curated-core"
          test "$(find "$RUNNER_TEMP/curated-core" -type f | wc -l)" -eq "$(( $(git ls-tree -r --name-only "$GITHUB_SHA" -- src/framework | wc -l) + 3 ))"
          test -e "$RUNNER_TEMP/curated-core/src/framework/Libs/Files.php"
          test ! -e "$RUNNER_TEMP/curated-core/src/framework/Libs/Mail.php"
          test ! -e "$RUNNER_TEMP/curated-core/docs"
          test ! -e "$RUNNER_TEMP/curated-core/archive"
          test ! -e "$RUNNER_TEMP/curated-core/packages"
      - name: Snapshot only curated PACK into Composer release repository
        shell: pwsh
        run: |
          ./scripts/composer/build-core-source-snapshot.ps1 -CuratedDirectory "$env:RUNNER_TEMP/curated-core" -SourceCommit "$env:GITHUB_SHA" -OutputDirectory "$env:RUNNER_TEMP/curated-snapshot" -Version 3.0.0
          if (-not (Test-Path "$env:RUNNER_TEMP/curated-snapshot/repository/composer.json")) { throw 'Composer snapshot is missing' }
          if (-not (Test-Path "$env:RUNNER_TEMP/curated-snapshot/release-provenance.json")) { throw 'External release provenance is missing' }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/curated-snapshot/repository" -File -Recurse | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          $expected = @(git ls-tree -r --name-only $env:GITHUB_SHA -- src/framework).Count + 3
          if ($files.Count -ne $expected) { throw "Snapshot should contain $expected core files; found $($files.Count)" }
          if (Test-Path "$env:RUNNER_TEMP/curated-snapshot/repository/docs") { throw 'Internal documentation leaked into the package' }
          if (Test-Path "$env:RUNNER_TEMP/curated-snapshot/repository/archive") { throw 'Archived code leaked into the package' }
      - name: Install and verify the exact Composer candidate
        shell: pwsh
        run: |
          $consumer = "$env:RUNNER_TEMP/curated-consumer"
          New-Item -ItemType Directory -Path $consumer | Out-Null
          $manifest = [ordered]@{
            name = 'boctulus/pack-verification-consumer'
            repositories = @(@{
              type = 'vcs'
              url = "$env:RUNNER_TEMP/curated-snapshot/repository"
            })
            require = @{
              'boctulus/simplerest' = '3.0.0'
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "$consumer/composer.json" -Encoding utf8
          composer install --working-dir=$consumer --no-dev --prefer-source --no-interaction --no-progress --no-scripts
          php scripts/composer/verify-installed-core.php --installed="$consumer/vendor/boctulus/simplerest" --provenance="$env:RUNNER_TEMP/curated-snapshot/release-provenance.json"

  legacy-cli-smoke:
    runs-on: ubuntu-latest
    name: Legacy application CLI smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, json, pdo
          coverage: none
          tools: composer:v2
      - name: Install isolated development dependencies
        env:
          COMPOSER: composer-dev.json
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Exercise legacy CLI with disposable, non-production env fixture
        run: |
          test ! -e .env
          cp .env.example .env
          trap 'rm -f .env' EXIT
          timeout 20s php com
          timeout 20s php com help
